<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Legal Helpdesk India</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#16233F; --navy-deep:#0E1830; --gold:#C9A227; --maroon:#7A2E2E;
    --paper:#F6F1E7; --ink:#201B14; --ink-soft:#5A5344; --line:#D8CDB2;
    --green:#0F6B4A; --red:#B23A3A; --blue:#2E5C8A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Devanagari',sans-serif;}
  header{background:var(--navy);color:#fff;padding:18px 20px;}
  header h1{font-family:'Noto Serif Devanagari',serif;font-size:1.25rem;margin:0;}
  header p{margin:4px 0 0;font-size:.8rem;color:#AEB6C9;}
  main{max-width:900px;margin:0 auto;padding:24px 18px 60px;}

  .login-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;max-width:400px;margin:40px auto;
    box-shadow:0 10px 30px rgba(32,27,20,.08);
  }
  .login-card label{display:block;font-weight:600;margin-bottom:8px;}
  .login-card input{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:7px;font-size:1rem;font-family:inherit;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 20px;border-radius:7px;font-weight:600;font-size:.92rem;border:none;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--maroon);color:#fff;width:100%;margin-top:14px;}
  .btn-approve{background:var(--green);color:#fff;}
  .btn-reject{background:var(--red);color:#fff;}
  .btn-delete{background:#8b8579;color:#fff;}
  .btn-blue{background:var(--blue);color:#fff;}
  .error-msg{color:var(--red);font-size:.85rem;margin-top:10px;display:none;}
  .error-msg.show{display:block;}

  #dashboard{display:none;}
  #dashboard.show{display:block;}

  .section-tabs{display:flex;gap:8px;margin-bottom:22px;}
  .section-tab{
    flex:1;background:#fff;border:1.5px solid var(--line);padding:14px;border-radius:10px;
    font-family:inherit;font-weight:700;font-size:.95rem;color:var(--ink-soft);cursor:pointer;text-align:center;
  }
  .section-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .section-panel{display:none;}
  .section-panel.active{display:block;}

  .tabs{display:flex;gap:6px;margin:20px 0 16px;border-bottom:1.5px solid var(--line);flex-wrap:wrap;}
  .tabbtn{
    background:none;border:none;padding:10px 16px;font-family:inherit;font-weight:600;font-size:.88rem;
    color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;
  }
  .tabbtn.active{color:var(--maroon);border-bottom-color:var(--maroon);}

  .review-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;
  }
  .review-card .rname{font-weight:700;color:var(--navy);}
  .review-card .rstars{color:var(--gold);letter-spacing:2px;margin:4px 0;}
  .review-card .rmsg{color:var(--ink);margin:8px 0;line-height:1.6;}
  .review-card .rmeta{font-size:.75rem;color:var(--ink-soft);margin-bottom:10px;}
  .review-card .ractions{display:flex;gap:8px;flex-wrap:wrap;}
  .status-badge{
    display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:12px;margin-left:8px;
  }
  .status-pending, .status-New{background:#FCE9C9;color:#8a5a00;}
  .status-approved, .status-Resolved{background:#D9F0E4;color:var(--green);}
  .status-rejected{background:#F6DADA;color:var(--red);}
  .status-Contacted{background:#DCE7F2;color:var(--blue);}
  .empty-note{color:var(--ink-soft);text-align:center;padding:30px 0;}
  .refresh-btn{background:var(--navy);color:#fff;margin-bottom:16px;}

  .hf-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .hf-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
  .hf-card .hf-name{font-weight:700;color:var(--navy);font-size:1rem;}
  .hf-card .hf-mobile{font-weight:700;color:var(--maroon);}
  .hf-card .hf-meta{font-size:.78rem;color:var(--ink-soft);margin:6px 0 10px;}
  .hf-card .hf-desc{color:var(--ink);margin:10px 0;line-height:1.6;}
  .hf-card .hf-row{display:flex;gap:6px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);margin-bottom:4px;}
  .hf-card .hf-row b{color:var(--ink);}
  .hf-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
</style>
</head>
<body>

<header>
  <h1>Legal Helpdesk India — Admin</h1>
  <p>रिव्ह्यू व कायदेशीर मदत विनंत्या व्यवस्थापित करण्यासाठी पेज (हे पान गुगल सर्चमध्ये दाखवलं जात नाही)</p>
</header>

<main>
  <div class="login-card" id="loginCard">
    <label for="pwInput">Admin पासवर्ड</label>
    <input type="password" id="pwInput" placeholder="पासवर्ड टाका">
    <button class="btn btn-primary" id="loginBtn">लॉगिन करा</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <div id="dashboard">
    <div class="section-tabs">
      <button class="section-tab active" data-section="helpRequests">📋 कायदेशीर मदत विनंत्या</button>
      <button class="section-tab" data-section="reviews">⭐ पुनरावलोकने</button>
    </div>

    <div class="section-panel active" id="panel-helpRequests">
      <div class="hf-toolbar">
        <button class="btn refresh-btn" id="hfRefreshBtn" style="margin-bottom:0;">🔄 रिफ्रेश करा</button>
        <button class="btn btn-blue" id="hfExcelBtn">⬇ Excel डाउनलोड करा</button>
      </div>
      <div class="tabs">
        <button class="tabbtn hf-filter active" data-filter="New">नवीन (New)</button>
        <button class="tabbtn hf-filter" data-filter="Contacted">संपर्क झाला (Contacted)</button>
        <button class="tabbtn hf-filter" data-filter="Resolved">निकाली (Resolved)</button>
        <button class="tabbtn hf-filter" data-filter="all">सर्व</button>
      </div>
      <div id="hfList"></div>
    </div>

    <div class="section-panel" id="panel-reviews">
      <button class="btn refresh-btn" id="refreshBtn">🔄 रिफ्रेश करा</button>
      <div class="tabs">
        <button class="tabbtn review-filter active" data-filter="pending">प्रलंबित (Pending)</button>
        <button class="tabbtn review-filter" data-filter="approved">मंजूर (Approved)</button>
        <button class="tabbtn review-filter" data-filter="rejected">नामंजूर (Rejected)</button>
        <button class="tabbtn review-filter" data-filter="all">सर्व</button>
      </div>
      <div id="reviewList"></div>
    </div>
  </div>
</main>

<script>
let adminPassword = "";
let allReviews = [];
let allHelpRequests = [];
let activeFilter = "pending";
let activeHfFilter = "New";

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('pwInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') login(); });

async function login(){
  const pw = document.getElementById('pwInput').value.trim();
  const errBox = document.getElementById('loginError');
  errBox.classList.remove('show');
  if(!pw){ return; }
  try{
    const [reviewsResp, hfResp] = await Promise.all([
      fetch('/.netlify/functions/admin-reviews?password=' + encodeURIComponent(pw)),
      fetch('/.netlify/functions/admin-legal-requests?password=' + encodeURIComponent(pw))
    ]);
    const reviewsData = await reviewsResp.json();
    const hfData = await hfResp.json();
    if(!reviewsResp.ok || !hfResp.ok){
      errBox.textContent = (reviewsData.error || hfData.error) || 'चुकीचा पासवर्ड.';
      errBox.classList.add('show');
      return;
    }
    adminPassword = pw;
    allReviews = reviewsData.reviews || [];
    allHelpRequests = hfData.requests || [];
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    renderList();
    renderHfList();
  }catch(err){
    errBox.textContent = 'सर्व्हरशी संपर्क होऊ शकला नाही.';
    errBox.classList.add('show');
  }
}

document.querySelectorAll('.section-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.section-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const section = btn.getAttribute('data-section');
    document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-' + section).classList.add('active');
  });
});

function escapeHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  const resp = await fetch('/.netlify/functions/admin-reviews?password=' + encodeURIComponent(adminPassword));
  const data = await resp.json();
  if(resp.ok){ allReviews = data.reviews || []; renderList(); }
});

document.querySelectorAll('.review-filter').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.review-filter').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.getAttribute('data-filter');
    renderList();
  });
});

function starString(n){
  n = Math.max(1, Math.min(5, n||5));
  return '★'.repeat(n) + '☆'.repeat(5-n);
}

function renderList(){
  const container = document.getElementById('reviewList');
  let list = allReviews;
  if(activeFilter !== 'all'){
    list = allReviews.filter(r => r.status === activeFilter);
  }
  if(list.length === 0){
    container.innerHTML = '<div class="empty-note">या यादीत सध्या काहीही नाही.</div>';
    return;
  }
  container.innerHTML = list.map(r => {
    const badgeClass = 'status-' + r.status;
    const dateStr = new Date(r.createdAt).toLocaleString('en-IN');
    let actions = '';
    if(r.status === 'pending'){
      actions = '<button class="btn btn-approve" onclick="doAction(\'' + r.id + '\',\'approve\')">✓ मंजूर करा</button>'
               + '<button class="btn btn-reject" onclick="doAction(\'' + r.id + '\',\'reject\')">✕ नामंजूर करा</button>';
    } else {
      actions = '<button class="btn btn-delete" onclick="doAction(\'' + r.id + '\',\'delete\')">🗑 कायमचं काढा</button>';
    }
    return '<div class="review-card">'
      + '<div class="rname">' + escapeHtml(r.name) + '<span class="status-badge ' + badgeClass + '">' + r.status + '</span></div>'
      + '<div class="rstars">' + starString(r.rating) + '</div>'
      + '<div class="rmeta">' + dateStr + '</div>'
      + '<div class="rmsg">' + escapeHtml(r.message) + '</div>'
      + '<div class="ractions">' + actions + '</div>'
      + '</div>';
  }).join('');
}

async function doAction(id, action){
  try{
    const resp = await fetch('/.netlify/functions/review-action', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ id: id, action: action, password: adminPassword })
    });
    const data = await resp.json();
    if(!resp.ok){
      alert(data.error || 'काहीतरी चुकलं.');
      return;
    }
    if(action === 'delete'){
      allReviews = allReviews.filter(r => r.id !== id);
    } else {
      allReviews = allReviews.map(r => r.id === id ? Object.assign({}, r, {status: action==='approve'?'approved':'rejected'}) : r);
    }
    renderList();
  }catch(err){
    alert('सर्व्हरशी संपर्क होऊ शकला नाही.');
  }
}

document.getElementById('hfRefreshBtn').addEventListener('click', async ()=>{
  const resp = await fetch('/.netlify/functions/admin-legal-requests?password=' + encodeURIComponent(adminPassword));
  const data = await resp.json();
  if(resp.ok){ allHelpRequests = data.requests || []; renderHfList(); }
});

document.querySelectorAll('.hf-filter').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.hf-filter').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeHfFilter = btn.getAttribute('data-filter');
    renderHfList();
  });
});

function renderHfList(){
  const container = document.getElementById('hfList');
  let list = allHelpRequests;
  if(activeHfFilter !== 'all'){
    list = allHelpRequests.filter(r => r.status === activeHfFilter);
  }
  if(list.length === 0){
    container.innerHTML = '<div class="empty-note">या यादीत सध्या काहीही नाही.</div>';
    return;
  }
  container.innerHTML = list.map(r => {
    const dateStr = new Date(r.submittedAt).toLocaleString('en-IN');
    const badgeClass = 'status-' + r.status;
    let actionButtons = '';
    if(r.status === 'New'){
      actionButtons += '<button class="btn btn-blue" onclick="setHfStatus(\'' + r.id + '\',\'Contacted\')">📞 संपर्क झाला</button>';
    }
    if(r.status !== 'Resolved'){
      actionButtons += '<button class="btn btn-approve" onclick="setHfStatus(\'' + r.id + '\',\'Resolved\')">✓ निकाली काढा</button>';
    }
    return '<div class="hf-card">'
      + '<div class="hf-name">' + escapeHtml(r.name) + '<span class="status-badge ' + badgeClass + '">' + r.status + '</span></div>'
      + '<div class="hf-meta">' + dateStr + '</div>'
      + '<div class="hf-row"><b>📱 ' + escapeHtml(r.mobile) + '</b>' + (r.email ? ' &nbsp;|&nbsp; ✉ ' + escapeHtml(r.email) : '') + '</div>'
      + '<div class="hf-row">' + (r.city ? escapeHtml(r.city) : '') + (r.district ? ', ' + escapeHtml(r.district) : '') + '</div>'
      + '<div class="hf-row"><b>' + escapeHtml(r.category || '-') + '</b> · ' + escapeHtml(r.preferredTime || '-') + '</div>'
      + '<div class="hf-desc">' + escapeHtml(r.description) + '</div>'
      + '<div class="hf-actions">' + actionButtons + '</div>'
      + '</div>';
  }).join('');
}

async function setHfStatus(id, status){
  try{
    const resp = await fetch('/.netlify/functions/admin-legal-requests', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ id: id, status: status, password: adminPassword })
    });
    const data = await resp.json();
    if(!resp.ok){
      alert(data.error || 'काहीतरी चुकलं.');
      return;
    }
    allHelpRequests = allHelpRequests.map(r => r.id === id ? Object.assign({}, r, {status: status}) : r);
    renderHfList();
  }catch(err){
    alert('सर्व्हरशी संपर्क होऊ शकला नाही.');
  }
}

document.getElementById('hfExcelBtn').addEventListener('click', ()=>{
  if(allHelpRequests.length === 0){
    alert('Excel मध्ये टाकण्यासाठी सध्या कोणताही डेटा नाही.');
    return;
  }
  const rows = allHelpRequests.map(r => ({
    "Name": r.name || "",
    "Mobile Number": r.mobile || "",
    "Email": r.email || "",
    "City": r.city || "",
    "District": r.district || "",
    "Issue Category": r.category || "",
    "Issue Description": r.description || "",
    "Preferred Contact Time": r.preferredTime || "",
    "Status": r.status || "",
    "Submitted At": r.submittedAt ? new Date(r.submittedAt).toLocaleString('en-IN') : "",
    "Language": r.lang || ""
  }));
  const worksheet = XLSX.utils.json_to_sheet(rows);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Legal Help Requests");
  worksheet['!cols'] = [
    {wch:20},{wch:15},{wch:24},{wch:16},{wch:16},{wch:20},{wch:45},{wch:18},{wch:12},{wch:20},{wch:10}
  ];
  const dateStamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(workbook, 'legal-help-requests-' + dateStamp + '.xlsx');
});
</script>
</body>
</html>
