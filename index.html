<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legal Help India — कायदेशीर मार्गदर्शन</title>
<meta name="description" content="Legal Help India — कायद्याची माहिती, सोप्या भाषेत मार्गदर्शन. मराठी, हिंदी, English.">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<link rel="stylesheet" href="user.css">
</head>
<body class="user">
<div class="offline-pill hide" id="offlinePill" data-t="offline_mode"></div>

<header class="top" id="topbar">
  <button class="iconbtn hide" id="backBtn" aria-label="Back"></button>
  <img src="icons/icon-192.png" alt="" class="brandmark" id="hdrLogo" width="40" height="40">
  <b id="hdrTitle"></b>
  <div class="lang" id="lang"><button data-l="mr">मराठी</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div>
</header>

<main class="wrap">

<!-- होम -->
<section class="view" id="v-home">
  <div class="hero2">
    <h1 data-t="hero_t"></h1>
    <p id="heroS" data-t="hero_s"></p>
    <a class="btn gold wide" href="#ask"><i class="ic-i" data-ic="ai-guide"></i><span data-t="cta_ask"></span></a>
    <a class="btn light wide" href="#help"><i class="ic-i" data-ic="consultation"></i><span id="ctaHelpTxt" data-t="cta_help"></span></a>
  </div>
  <div class="note hide" id="notice"></div>
  <h2 class="sec-title" data-t="quick_t"></h2>
  <div class="qgrid">
    <a class="tile" href="#search"><i class="ic-i" data-ic="search"></i><span data-t="qa_search"></span></a>
    <a class="tile" href="#const"><i class="ic-i" data-ic="constitution"></i><span data-t="qa_const"></span></a>
    <a class="tile" href="#rights"><i class="ic-i" data-ic="rights"></i><span data-t="qa_rights"></span></a>
    <a class="tile" href="#forms"><i class="ic-i" data-ic="documents"></i><span data-t="qa_docs"></span></a>
    <a class="tile" href="#help"><i class="ic-i" data-ic="consultation"></i><span data-t="qa_helpreq"></span></a>
    <a class="tile" href="#status"><i class="ic-i" data-ic="requests"></i><span data-t="qa_status"></span></a>
  </div>
  <p class="foot" data-t="disc"></p>
</section>

<!-- कायदा शोधा -->
<section class="view hide" id="v-search">
  <div class="sbar"><i class="ic-i" data-ic="search"></i><input id="sq" data-p="search_ph" autocomplete="off" enterkeyhint="search"><button class="sclear hide" id="sqClear" aria-label="Clear">&times;</button></div>
  <div class="chips" id="sChips"></div>
  <div id="sBody"></div>
</section>

<!-- संविधान -->
<section class="view hide" id="v-const">
  <div id="cBanner"></div>
  <h2 class="sec-title" data-t="art_search"></h2>
  <div class="sbar"><i class="ic-i" data-ic="search"></i><input id="cq" data-p="art_search_ph" autocomplete="off"><button class="sclear hide" id="cqClear" aria-label="Clear">&times;</button></div>
  <div id="cBody"></div>
</section>

<!-- माझे हक्क -->
<section class="view hide" id="v-rights"><div id="rBody"></div></section>

<!-- विषयाचे पान -->
<section class="view hide" id="v-topic"><div id="tBody"></div></section>

<!-- नमुना अर्ज -->
<section class="view hide" id="v-forms">
  <div class="chips" id="fChips"></div>
  <div id="fBody"></div>
</section>

<!-- AI -->
<section class="view hide" id="v-ask">
  <p class="mut" data-t="ask_sub" style="margin-bottom:10px"></p>
  <div class="card" style="padding:14px">
    <textarea id="askQ" data-p="ask_ph" maxlength="500"></textarea>
    <div class="counter"><span id="askCount">0</span>/500</div>
    <button class="btn wide" id="askBtn"><i class="ic-i" data-ic="send"></i><span data-t="ask_btn"></span></button>
    <div class="msg hide" id="askOut"></div>
  </div>
  <h2 class="sec-title" data-t="ex_t"></h2>
  <div id="exList"></div>
  <div class="note" style="margin-top:14px" data-t="disc_short"></div>
</section>

<!-- कायदेशीर मदत मागा -->
<section class="view hide" id="v-help">
  <div class="card">
    <div class="stepper" id="wizSteps"></div>

    <div class="wiz-step" data-step="1">
      <label data-t="f_name"></label><input id="fName" autocomplete="name" maxlength="100" data-p="ph_name">
      <label data-t="f_mobile"></label><input id="fMobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" data-p="ph_mobile">
      <label data-t="f_email"></label><input id="fEmail" type="email" autocomplete="email" maxlength="120" data-p="ph_email">
      <label data-t="f_city"></label><input id="fCity" maxlength="100" autocomplete="address-level2" data-p="ph_city">
      <label data-t="f_district"></label><input id="fDistrict" maxlength="100" list="districtList" data-p="ph_district">
      <datalist id="districtList"></datalist>
    </div>
    <div class="wiz-step hide" data-step="2">
      <label data-t="f_cat"></label><select id="fCat"></select>
    </div>
    <div class="wiz-step hide" data-step="3">
      <label data-t="f_desc"></label><textarea id="fDesc" maxlength="1500" data-p="ph_desc"></textarea>
    </div>
    <div class="wiz-step hide" data-step="4">
      <label data-t="f_time"></label><select id="fTime"><option value="Anytime" data-t="tm0"></option><option value="Morning" data-t="tm1"></option><option value="Afternoon" data-t="tm2"></option><option value="Evening" data-t="tm3"></option></select>
    </div>
    <div class="wiz-step hide" data-step="5">
      <h3 data-t="wiz_review"></h3><div id="wizSummary" class="summary"></div>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="wizBack" data-t="wiz_back"></button>
      <button class="btn wide" id="wizNext"><span data-t="wiz_next"></span></button>
      <button class="btn wide hide" id="fBtn"><i class="ic-i" data-ic="send"></i><span data-t="f_send"></span></button>
    </div>
    <div class="msg hide" id="fOut"></div>
  </div>
</section>

<!-- माझी विनंती -->
<section class="view hide" id="v-status">
  <div class="card">
    <label data-t="st_id"></label><input id="trId" autocapitalize="none" data-p="ph_reqid">
    <label data-t="st_mob"></label>
    <div class="inrow"><input id="trMob" type="tel" inputmode="numeric" maxlength="14" data-p="ph_mobile"><button class="btn" id="trBtn" aria-label="Search"><i class="ic-i" data-ic="search"></i></button></div>
    <p class="mut" style="margin-top:8px;font-size:.85rem" data-t="st_hint"></p>
  </div>
  <h2 class="sec-title" data-t="st_t"></h2>
  <div id="trOut"></div>
</section>

<!-- माहिती हब -->
<section class="view hide" id="v-info"><div id="iBody"></div></section>

<!-- मदत केंद्र -->
<section class="view hide" id="v-contact"><div id="hBody"></div></section>

<!-- अभिप्राय -->
<section class="view hide" id="v-reviews">
  <div id="rvBody"></div>
  <div class="card hide" id="revForm"><h3 data-t="r_write"></h3>
    <label data-t="r_name"></label><input id="rName" maxlength="80">
    <label>★</label><select id="rRate"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
    <label data-t="r_msg"></label><textarea id="rMsg" maxlength="600"></textarea>
    <button class="btn wide" id="rBtn" style="margin-top:14px" data-t="r_send"></button><div class="msg hide" id="rOut"></div></div>
</section>

<!-- आमच्याबद्दल -->
<section class="view hide" id="v-about"><div id="aBody"></div></section>

<!-- आमची टीम -->
<section class="view hide" id="v-team"><div id="tmBody"></div></section>

<div class="modal hide" id="pdfModal"><div class="sheet" id="pdfSheet"></div></div>
<div class="modal hide" id="sheetModal"><div class="sheet" id="sheetBody"></div></div>
</main>

<nav class="nav" id="nav">
  <a href="#home" data-r="home"><i class="ic-i" data-ic="home"></i><span data-t="nav_home"></span></a>
  <a href="#ask" data-r="ask"><i class="ic-i" data-ic="ai-guide"></i><span data-t="nav_ask"></span></a>
  <a href="#help" data-r="help"><i class="ic-i" data-ic="consultation"></i><span data-t="nav_help"></span></a>
  <a href="#info" data-r="info"><i class="ic-i" data-ic="info"></i><span data-t="nav_info"></span></a>
</nav>

<script src="shared/icons.js"></script>
<script src="shared/config.js"></script>
<script src="shared/pdf.js"></script>
<script src="shared/content.js"></script>
<script src="shared/content2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
