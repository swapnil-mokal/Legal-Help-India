<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legal Help India — कायदेशीर मार्गदर्शन</title>
<meta name="description" content="Legal Help India — भारतीय संविधान, नागरिक हक्क आणि कायदेशीर मार्गदर्शन. मराठी, हिंदी, English.">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<style>.sub{margin-bottom:6px}.stars{color:var(--gold);letter-spacing:2px}.copy{font-family:monospace;background:#fff;padding:2px 8px;border-radius:6px;font-weight:700}.art b{color:var(--gold);margin-right:6px}
.qa-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.qa-grid .tile{padding:14px 6px;font-size:.82rem}.qa-grid .tile i.ic-i{width:22px;height:22px;margin-bottom:5px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}.section-h h2{font-size:1.05rem;margin:0}.section-h a{font-size:.82rem;color:var(--navy);font-weight:700}
.rights-chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.rights-chip-row a{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px;font-size:.78rem;font-weight:600;color:var(--ink);min-width:76px;text-align:center}.rights-chip-row a i.ic-i,.rights-chip-row a .ic{width:22px;height:22px}
.mini-card{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:8px}.mini-card b{display:block;color:var(--navy);font-size:.92rem;margin-bottom:2px}.mini-card p{font-size:.84rem;color:var(--mut);margin:0}
.trust-row{display:flex;gap:10px;text-align:center;margin-bottom:14px}.trust-row div{flex:1;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:10px 4px;font-size:.72rem;color:var(--mut);font-weight:600}.trust-row div b{display:block;font-size:1.2rem;color:var(--navy)}
.offline-pill{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#1b2433;color:#fff;padding:5px 14px;border-radius:20px;font-size:.76rem;z-index:70;box-shadow:var(--sh)}
</style>
</head>
<body>
<div class="offline-pill hide" id="offlinePill" data-t="offline_mode"></div>
<header class="top">
  <img src="icons/icon-192.png" alt="" class="brandmark"><b>Legal Help India<small data-t="tag"></small></b>
  <div class="lang" id="lang"><button data-l="mr">मराठी</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div>
</header>
<main class="wrap">

<section class="view" id="v-home">
  <div class="hero"><h1 data-t="hero_t"></h1><p id="heroS" data-t="hero_s"></p>
    <div class="row"><a class="btn gold" href="#ask" data-t="cta_ask"></a><a class="btn light" href="#help" id="ctaHelp" data-t="cta_help"></a></div></div>
  <div class="note hide" id="notice"></div>

  <div class="qa-grid">
    <a class="tile" href="#info-search"><i class="ic-i" data-ic="search"></i><span data-t="qa_search"></span></a>
    <a class="tile" href="#info-const"><i class="ic-i" data-ic="constitution"></i><span data-t="t_const"></span></a>
    <a class="tile" href="#info-rights"><i class="ic-i" data-ic="rights"></i><span data-t="qa_rights"></span></a>
    <a class="tile" href="#info-docs"><i class="ic-i" data-ic="documents"></i><span data-t="qa_docs"></span></a>
    <a class="tile" href="#help"><i class="ic-i" data-ic="consultation"></i><span data-t="qa_helpreq"></span></a>
    <a class="tile" href="#help-status"><i class="ic-i" data-ic="requests"></i><span data-t="qa_status"></span></a>
  </div>

  <div class="section-h"><h2 data-t="qa_rights"></h2><a href="#info-rights" data-t="see_all"></a></div>
  <div class="rights-chip-row" id="homeRightsChips"></div>

  <div class="section-h"><h2 data-t="t_const"></h2><a href="#info-const" data-t="see_all"></a></div>
  <div id="homeConstPreview"></div>

  <div class="section-h"><h2 data-t="qa_docs"></h2><a href="#info-docs" data-t="see_all"></a></div>
  <div id="homeDocsPreview"></div>

  <div class="section-h"><h2 data-t="r_t"></h2><a href="#reviews" data-t="see_all"></a></div>
  <div id="homeReviewsPreview"></div>

  <div class="trust-row">
    <div><b>३</b><span data-t="trust_lang"></span></div>
    <div><b>२४×७</b><span data-t="trust_ai"></span></div>
    <div><b>✓</b><span data-t="trust_free"></span></div>
  </div>
  <a class="mini-card" href="#about" style="display:block;text-decoration:none">
    <b data-t="about_title"></b><p class="mut" data-t="about_teaser"></p>
  </a>
  <div class="card"><h3 data-t="contact"></h3>
    <div class="row" style="margin-top:10px"><a class="btn ok" id="cWa" target="_blank" rel="noopener">WhatsApp</a><a class="btn ghost" id="cCall" data-t="call"></a><a class="btn ghost" id="cMail" data-t="email"></a></div>
    <button class="btn ghost" id="shareAppBtn" style="width:100%;margin-top:10px" data-t="share_app_btn"></button></div>
  <button class="btn ghost" id="exitAppBtn" style="width:100%" data-t="exit_app"></button>
</section>

<section class="view hide" id="v-ask">
  <div class="card"><h2 data-t="ask_t"></h2><p class="mut" data-t="ask_note"></p>
    <textarea id="askQ" data-p="ask_ph" maxlength="3000" style="margin-top:12px"></textarea>
    <div class="chips" style="margin-top:8px"><button data-ex="ex1"></button><button data-ex="ex2"></button><button data-ex="ex3"></button><button data-ex="ex4"></button></div>
    <button class="btn full" id="askBtn" style="width:100%" data-t="ask_btn"></button>
    <div class="msg hide" id="askOut"></div></div>
</section>

<section class="view hide" id="v-help">
  <div class="chips sub" id="helpSub"><button data-hs="form" data-t="hs_form"></button><button data-hs="status" data-t="hs_status"></button></div>

  <div id="helpFormWrap" class="card">
    <h2 data-t="help_t"></h2><p class="mut" data-t="help_s"></p>
    <div class="steps" id="wizSteps"></div>
    <p class="mut" id="wizCaption" style="margin-bottom:10px"></p>

    <div class="wiz-step" data-step="1">
      <label data-t="f_name"></label><input id="fName" autocomplete="name" maxlength="100">
      <label data-t="f_mobile"></label><input id="fMobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14">
      <label data-t="f_email"></label><input id="fEmail" type="email" autocomplete="email" maxlength="120">
      <label data-t="f_city"></label><input id="fCity" maxlength="100">
      <label data-t="f_district"></label><input id="fDistrict" maxlength="100">
    </div>
    <div class="wiz-step hide" data-step="2">
      <label data-t="f_cat"></label><select id="fCat"></select>
    </div>
    <div class="wiz-step hide" data-step="3">
      <label data-t="f_desc"></label><textarea id="fDesc" maxlength="1500"></textarea>
    </div>
    <div class="wiz-step hide" data-step="4">
      <label data-t="f_time"></label><select id="fTime"><option value="Anytime" data-t="tm0"></option><option value="Morning" data-t="tm1"></option><option value="Afternoon" data-t="tm2"></option><option value="Evening" data-t="tm3"></option></select>
    </div>
    <div class="wiz-step hide" data-step="5">
      <h3 data-t="wiz_review"></h3><div id="wizSummary" class="mini-card"></div>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="wizBack" data-t="wiz_back"></button>
      <button class="btn" id="wizNext" data-t="wiz_next"></button>
      <button class="btn hide" id="fBtn" data-t="f_send"></button>
    </div>
    <div class="msg hide" id="fOut"></div>
  </div>

  <div class="card hide" id="trackCard">
    <h2 data-t="tr_t"></h2>
    <label data-t="tr_id"></label><input id="trId" autocapitalize="none"><label data-t="f_mobile"></label><input id="trMob" type="tel" inputmode="numeric" maxlength="14">
    <button class="btn ghost" id="trBtn" style="width:100%;margin-top:14px" data-t="tr_btn"></button><div class="msg hide" id="trOut"></div>
  </div>
</section>

<section class="view hide" id="v-info">
  <div class="chips sub" id="sub"><button data-s="search" data-t="qa_search"></button><button data-s="rights" data-t="qa_rights"></button><button data-s="docs" data-t="qa_docs"></button></div>
  <div id="l-const"><input id="q" data-p="search_ph" style="margin-bottom:10px"><div class="chips" id="cats"></div><div id="arts"></div></div>
  <div id="l-topics" class="hide"></div>
  <div id="l-docs" class="hide"></div>
</section>

<section class="view hide" id="v-reviews">
  <h2 data-t="r_t" style="margin-bottom:10px"></h2><div id="revList"></div>
  <div class="card"><h3 data-t="r_write"></h3>
    <label data-t="r_name"></label><input id="rName" maxlength="80">
    <label>★</label><select id="rRate"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
    <label data-t="r_msg"></label><textarea id="rMsg" maxlength="600"></textarea>
    <button class="btn" id="rBtn" style="width:100%;margin-top:14px" data-t="r_send"></button><div class="msg hide" id="rOut"></div></div>
</section>

<section class="view hide" id="v-about">
  <div class="card"><h2 data-t="about_title"></h2><p class="mut" data-t="about_mission_h"></p><p style="margin-top:4px" data-t="about_mission"></p></div>
  <div class="card"><h3 data-t="about_provide_h"></h3><ul id="aboutProvideList"></ul></div>
  <div class="card"><h3 data-t="about_team_h"></h3>
    <div style="display:flex;gap:14px;align-items:flex-start;margin-top:8px">
      <img src="about-swapnil-mokal.jpg" alt="Swapnil Mokal" style="width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)">
      <p class="mut" style="margin:0" data-t="about_bio"></p>
    </div>
    <div style="display:flex;gap:14px;align-items:flex-start;margin-top:14px">
      <img src="about-prashant-abhang.jpg" alt="Dr. Prashant Abhang" style="width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)">
      <p class="mut" style="margin:0" data-t="about_bio2"></p>
    </div>
    <p class="mut" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.85rem" data-t="about_owner"></p>
  </div>
  <div class="note"><b data-t="about_disc_h"></b><p style="margin-top:4px" data-t="disc"></p></div>
</section>

<div class="modal hide" id="pdfModal"><div class="sheet" id="pdfSheet"></div></div>
</main>
<footer><span data-t="copyright" style="opacity:.8;font-size:.8rem"></span></footer>
<nav class="nav" id="nav"><a href="#home"><i class="ic-i" data-ic="home"></i><span data-t="nav_home"></span></a><a href="#ask"><i class="ic-i" data-ic="ai-guide"></i><span data-t="nav_ask"></span></a><a href="#help"><i class="ic-i" data-ic="consultation"></i><span data-t="nav_help"></span></a><a href="#info"><i class="ic-i" data-ic="laws"></i><span data-t="nav_info"></span></a></nav>

<script src="shared/icons.js"></script>
<script src="shared/config.js"></script>
<script src="shared/pdf.js"></script>
<script src="shared/content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
