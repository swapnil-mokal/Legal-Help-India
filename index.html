<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legal Helpdesk India — कायदेशीर मार्गदर्शन</title>
<meta name="description" content="Legal Helpdesk India — भारतीय संविधान, नागरिक हक्क आणि कायदेशीर मार्गदर्शन. मराठी, हिंदी, English.">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<style>.sub{margin-bottom:6px}.stars{color:var(--gold);letter-spacing:2px}.copy{font-family:monospace;background:#fff;padding:2px 8px;border-radius:6px;font-weight:700}.art b{color:var(--gold);margin-right:6px}</style>
</head>
<body>
<header class="top">
  <img src="icons/icon-192.png" alt="" class="brandmark"><b>Legal Helpdesk India<small data-t="tag"></small></b>
  <div class="lang" id="lang"><button data-l="mr">मराठी</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div>
</header>
<main class="wrap">

<section class="view" id="v-home">
  <div class="hero"><h1 data-t="hero_t"></h1><p id="heroS" data-t="hero_s"></p>
    <div class="row"><a class="btn gold" href="#ask" data-t="cta_ask"></a><a class="btn light" href="#help" id="ctaHelp" data-t="cta_help"></a></div></div>
  <div class="note hide" id="notice"></div>
  <div class="grid2">
    <a class="tile" href="#ask"><i class="ic-i" data-ic="ai-guide"></i><span data-t="nav_ask"></span></a>
    <a class="tile" href="#help"><i class="ic-i" data-ic="consultation"></i><span data-t="nav_help"></span></a>
    <a class="tile" href="#help-track"><i class="ic-i" data-ic="requests"></i><span data-t="t_track"></span></a>
    <a class="tile" href="#learn-topics"><i class="ic-i" data-ic="rights"></i><span data-t="t_topics"></span></a>
    <a class="tile" href="#learn-docs"><i class="ic-i" data-ic="documents"></i><span data-t="t_docs"></span></a>
    <a class="tile" href="#learn-const"><i class="ic-i" data-ic="constitution"></i><span data-t="t_const"></span></a>
  </div>
  <div class="card"><h3 data-t="contact"></h3>
    <div class="row" style="margin-top:10px"><a class="btn ok" id="cWa" target="_blank" rel="noopener">WhatsApp</a><a class="btn ghost" id="cCall" data-t="call"></a><a class="btn ghost" id="cMail" data-t="email"></a></div></div>
</section>

<section class="view hide" id="v-ask">
  <div class="card"><h2 data-t="ask_t"></h2><p class="mut" data-t="ask_note"></p>
    <textarea id="askQ" data-p="ask_ph" maxlength="3000" style="margin-top:12px"></textarea>
    <div class="chips" style="margin-top:8px"><button data-ex="ex1"></button><button data-ex="ex2"></button><button data-ex="ex3"></button></div>
    <button class="btn full" id="askBtn" style="width:100%" data-t="ask_btn"></button>
    <div class="msg hide" id="askOut"></div></div>
</section>

<section class="view hide" id="v-help">
  <div class="card"><h2 data-t="help_t"></h2><p class="mut" data-t="help_s"></p>
    <label data-t="f_name"></label><input id="fName" autocomplete="name" maxlength="100">
    <label data-t="f_mobile"></label><input id="fMobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14">
    <label data-t="f_city"></label><input id="fCity" maxlength="100">
    <label data-t="f_cat"></label><select id="fCat"></select>
    <label data-t="f_desc"></label><textarea id="fDesc" maxlength="1500"></textarea>
    <label data-t="f_time"></label><select id="fTime"><option value="Anytime" data-t="tm0"></option><option value="Morning" data-t="tm1"></option><option value="Afternoon" data-t="tm2"></option><option value="Evening" data-t="tm3"></option></select>
    <button class="btn" id="fBtn" style="width:100%;margin-top:16px" data-t="f_send"></button>
    <div class="msg hide" id="fOut"></div></div>
  <div class="card" id="trackCard"><h2 data-t="tr_t"></h2>
    <label data-t="tr_id"></label><input id="trId" autocapitalize="none"><label data-t="f_mobile"></label><input id="trMob" type="tel" inputmode="numeric" maxlength="14">
    <button class="btn ghost" id="trBtn" style="width:100%;margin-top:14px" data-t="tr_btn"></button><div class="msg hide" id="trOut"></div></div>
</section>

<section class="view hide" id="v-learn">
  <div class="chips sub" id="sub"><button data-s="topics" data-t="l_topics"></button><button data-s="docs" data-t="l_docs"></button><button data-s="const" data-t="l_const"></button></div>
  <div id="l-topics"></div><div id="l-docs" class="hide"></div>
  <div id="l-const" class="hide"><input id="q" data-p="search_ph" style="margin-bottom:10px"><div class="chips" id="cats"></div><div id="arts"></div></div>
</section>

<section class="view hide" id="v-reviews">
  <h2 data-t="r_t" style="margin-bottom:10px"></h2><div id="revList"></div>
  <div class="card"><h3 data-t="r_write"></h3>
    <label data-t="r_name"></label><input id="rName" maxlength="80">
    <label>★</label><select id="rRate"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
    <label data-t="r_msg"></label><textarea id="rMsg" maxlength="600"></textarea>
    <button class="btn" id="rBtn" style="width:100%;margin-top:14px" data-t="r_send"></button><div class="msg hide" id="rOut"></div></div>
</section>
<div class="modal hide" id="pdfModal"><div class="sheet" id="pdfSheet"></div></div>
</main>
<footer data-t="disc"></footer>
<nav class="nav" id="nav"><a href="#home"><i class="ic-i" data-ic="home"></i><span data-t="nav_home"></span></a><a href="#ask"><i class="ic-i" data-ic="ai-guide"></i><span data-t="nav_ask"></span></a><a href="#help"><i class="ic-i" data-ic="help"></i><span data-t="nav_help"></span></a><a href="#learn"><i class="ic-i" data-ic="laws"></i><span data-t="nav_learn"></span></a><a href="#reviews"><i class="ic-i" data-ic="messages"></i><span data-t="nav_rev"></span></a></nav>

<script src="shared/icons.js"></script>
<script src="shared/config.js"></script>
<script src="shared/pdf.js"></script>
<script src="shared/content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
