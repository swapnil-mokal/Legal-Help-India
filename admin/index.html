<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin — Legal Helpdesk India</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14325c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login">
  <div class="lang" id="loginLang"><button data-l="mr">मराठी</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div>
  <div class="card lbox">
    <img src="logo.svg" alt="" width="64" height="64"><h1 data-i="login_title"></h1><p class="mut" data-i="login_sub"></p>
    <label data-i="pw_label"></label><input id="pw" type="password" autocomplete="current-password" data-ip="pw_ph">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:16px" data-i="login_btn"></button><div class="msg hide" id="loginMsg"></div>
  </div>
</section>
<div id="app" class="hide">
  <header class="top"><img src="logo.svg" alt=""><b>Admin<small>Legal Helpdesk India</small></b>
    <div class="lang" id="appLang"><button data-l="mr">मराठी</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div>
    <button class="btn light sm" id="logout" data-i="logout"></button></header>
  <main class="wrap" id="main"></main>
  <nav class="nav" id="nav"><button data-tab="dash"><i>📊</i><span data-i="tab_dash"></span></button><button data-tab="req"><i>📋</i><span data-i="tab_req"></span></button><button data-tab="rev"><i>⭐</i><span data-i="tab_rev"></span></button><button data-tab="con"><i>✏️</i><span data-i="tab_con"></span></button></nav>
</div>
<div class="toast hide" id="toast"></div>
<script src="../shared/config.js"></script>
<script src="app.js"></script>
</body>
</html>
